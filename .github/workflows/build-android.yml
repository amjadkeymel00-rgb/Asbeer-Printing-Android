name: Build Asbeer Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Asbeer UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets app/src/main/res/drawable output

          fetch_blob_text() {
            local sha="$1"
            local out="$2"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$out"
          }

          fetch_blob_text "0e352d9c28e07fb3722e0769b85701d2723bf276" /tmp/web00
          fetch_blob_text "fa667691000ae3475a26717e945026d3b64fa005" /tmp/web01
          cat /tmp/web00 /tmp/web01 webpayload/02 > /tmp/index.b64
          base64 -d /tmp/index.b64 > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > app/src/main/assets/index.html

          cat > app/src/main/assets/asbeer-logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
            <rect width="720" height="360" rx="40" fill="#ffffff"/>
            <g fill="#111111">
              <path d="M82 245c76-7 115-44 149-103 30-53 61-92 116-106-48 42-78 88-101 136-27 57-71 104-164 108z"/>
              <path d="M264 214c28-52 66-82 119-92-31 24-50 53-64 84-13 28-26 46-55 57z"/>
              <path d="M344 214c28-52 66-82 119-92-31 24-50 53-64 84-13 28-26 46-55 57z"/>
              <path d="M424 214c28-52 66-82 119-92-31 24-50 53-64 84-13 28-26 46-55 57z"/>
              <text x="300" y="112" font-family="Arial,sans-serif" font-size="62" font-weight="700">Asbeer</text>
              <text x="500" y="112" font-family="Arial,sans-serif" font-size="28" letter-spacing="8">printing</text>
              <text x="175" y="324" font-family="Arial,sans-serif" font-size="25">Email: aspeer.prees@gmail.com</text>
            </g>
          </svg>
          SVG

          sed -i 's#file:///android_asset/logo0.webp#file:///android_asset/asbeer-logo.svg#g; s#file:///android_asset/logo1.webp#file:///android_asset/asbeer-logo.svg#g' app/src/main/assets/index.html

          cat > app/src/main/res/drawable/logo.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#172844" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M20,79C34,77 40,68 47,54C54,40 63,29 82,23C70,36 64,48 59,60C52,76 40,87 20,89Z"/>
              <path android:fillColor="#39A994" android:pathData="M46,78C53,64 63,56 76,53C68,60 64,68 61,76C58,82 53,86 46,89Z"/>
          </vector>
          XML

          test -s app/src/main/assets/index.html
          grep -q "Asbeer Printing" app/src/main/assets/index.html

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk output/Asbeer-Printing.apk
          ls -lh output/Asbeer-Printing.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asbeer-Printing-APK
          path: output/Asbeer-Printing.apk
          if-no-files-found: error
          retention-days: 30
