name: Build Asbeer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'parts/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore packaged web app
        shell: bash
        run: |
          set -e
          rm -f /tmp/asbeer.b64 /tmp/asbeer.zip
          for i in $(seq -w 0 10); do
            test -f "parts/part-$i"
            head -c 18000 "parts/part-$i" >> /tmp/asbeer.b64
          done
          cat parts/part-11 >> /tmp/asbeer.b64
          base64 -d /tmp/asbeer.b64 > /tmp/asbeer.zip
          rm -rf /tmp/asbeer-unpacked
          mkdir -p /tmp/asbeer-unpacked
          unzip -q /tmp/asbeer.zip -d /tmp/asbeer-unpacked
          mkdir -p app/src/main/assets
          cp /tmp/asbeer-unpacked/Asbeer_Printing_Android/app/src/main/assets/index.html app/src/main/assets/index.html
          test -s app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Asbeer-Printing.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asbeer-Printing-APK
          path: Asbeer-Printing.apk
          if-no-files-found: error
