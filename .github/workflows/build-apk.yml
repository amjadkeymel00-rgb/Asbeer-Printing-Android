name: Build Asbeer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q Asbeer_Printing_Android_Project.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc/Asbeer_Printing_Android
        run: gradle --no-daemon assembleDebug

      - name: Copy final APK
        run: |
          mkdir -p output
          cp buildsrc/Asbeer_Printing_Android/app/build/outputs/apk/debug/app-debug.apk output/Asbeer-Printing.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asbeer-Printing-APK
          path: output/Asbeer-Printing.apk
          if-no-files-found: error
          retention-days: 30
